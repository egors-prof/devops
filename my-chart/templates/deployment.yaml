apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          imagePullPolicy: Never 
          command:
            {{- range .Values.command }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.createService }}
          ports:
            - containerPort: {{ .Values.port }}
          {{- end }}